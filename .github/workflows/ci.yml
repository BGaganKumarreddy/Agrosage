name: AgroSage CI

on:
  push:
    branches:
      - main
      - '**'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Astral uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.6.5'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Pytest test suite
        run: uv run pytest tests/ -v
        env:
          AGROSAGE_ALLOW_IN_MEMORY_KEY_STORE: '1'
          RYTHUSAATHI_ALLOW_IN_MEMORY_KEY_STORE: '1'

  frontend-ci:
    name: Frontend Vitest & Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest tests
        working-directory: frontend
        run: npm test

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend production assets
        working-directory: frontend
        run: npm run build

  docker-validation:
    name: Docker Validation & Build Smoke
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: false
          tags: agrosage-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          tags: agrosage-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
